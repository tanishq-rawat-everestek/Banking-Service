[project]
name = "agilery-python-skeleton"
version = "1.0.0"
description = "Reusable Python FastAPI service skeleton for Agilery examples."
authors = [
    { name = "Agilery", email = "contacts@agilery.ai" }
]
requires-python = ">=3.12,<4.0"

dependencies = [
    "alembic (>=1.18.1,<2.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "fastapi (>=0.128.0,<0.129.0)",
    "fastapi-camelcase (>=2.0.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "pymysql (>=1.1.2,<2.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "sqlmodel (>=0.0.31,<0.0.32)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "cryptography (>=49.0.0,<50.0.0)",
    "sqlalchemy (>=2.0.0,<3.0.0)",
]

[dependency-groups]
dev = [
    "mock (>=5.2.0,<6.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "ruff (>=0.14.13,<0.15.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
    "pysonar (>=1.6.0.4905,<2.0.0.0)",
    "opentelemetry-instrumentation (>=0.65b0,<1.0.0)",
    "opentelemetry-distro (>=0.65b0,<1.0.0)",
    "opentelemetry-exporter-otlp (>=1.43.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "ai"}]

[tool.pytest.ini_options]
addopts = [
    "--cov=ai.agilery.app",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ai.agilery.app"]

[tool.coverage.report]
show_missing = true
skip_covered = false